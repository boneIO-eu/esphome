# Factory firmware (CI, boneio.eu/esp): boneio-32x10_switches_v0_7.yaml plus boneIO updates.
substitutions:
  # CI sets the release; the update entity compares it with the manifest.
  firmware_version: "dev"

packages:
  device: !include ../boneio-32x10_switches_v0_7.yaml
  update: !include update.yaml
  api_key: !include api_key.yaml

esphome:
  project:
    version: "0.7-${firmware_version}"
