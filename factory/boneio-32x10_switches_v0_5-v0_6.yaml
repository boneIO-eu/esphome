# Factory firmware (CI, boneio.eu/esp): boneio-32x10_switches_v0_5-v0_6.yaml plus boneIO updates.
substitutions:
  # CI sets the release; the update entity compares it with the manifest.
  firmware_version: "dev"
  variant_label: "Switches"

packages:
  device: !include ../boneio-32x10_switches_v0_5-v0_6.yaml
  update: !include update.yaml
  api_key: !include api_key.yaml
  variant: !include variant.yaml

esphome:
  project:
    version: "0.6-${firmware_version}"

# The device web page has no per-device password; the installer offers it as
# a separate "+ web panel" option (factory/web/).
web_server: !remove
