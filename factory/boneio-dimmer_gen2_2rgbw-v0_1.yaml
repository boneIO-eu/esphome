# Factory firmware (CI, boneio.eu/esp): boneio-dimmer_gen2_2rgbw-v0_1.yaml plus boneIO updates.
substitutions:
  # CI sets the release; the update entity compares it with the manifest.
  firmware_version: "dev"
  dimmer_mode: "2x RGBW"

packages:
  device: !include ../boneio-dimmer_gen2_2rgbw-v0_1.yaml
  update: !include update.yaml
  api_key: !include api_key.yaml
  dimmer_mode: !include dimmer_variant.yaml

esphome:
  project:
    version: "0.1-2rgbw-${firmware_version}"

# The device web page has no per-device password; the installer offers it as
# a separate "+ web panel" option (factory/web/).
web_server: !remove
