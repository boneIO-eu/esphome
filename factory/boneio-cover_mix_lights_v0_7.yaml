# Factory firmware (CI, boneio.eu/esp): boneio-cover_mix_lights_v0_7.yaml plus boneIO updates.
substitutions:
  # CI sets the release; the update entity compares it with the manifest.
  firmware_version: "dev"

packages:
  device: !include ../boneio-cover_mix_lights_v0_7.yaml
  update: !include update.yaml

esphome:
  project:
    version: "0.7-${firmware_version}"
