# Switches the Dimmer between its firmware variants from Home Assistant, each
# with or without the device web page. The page has no password, so it is off
# unless the owner picks it. The variant is part of project.version, so the
# Firmware entity sees it as a different version.
select:
  - platform: template
    id: firmware_variant
    name: Firmware variant
    icon: mdi:tune-variant
    entity_category: config
    options:
      - 8 channels
      - 8 channels + web panel
      - 2x RGBW
      - 2x RGBW + web panel
      - 4x CCT
      - 4x CCT + web panel
    initial_option: "${dimmer_mode}${web_option}"
    optimistic: true
    set_action:
      - lambda: |-
          std::string mode = x.str();
          bool web = str_endswith(mode, " + web panel");
          if (web)
            mode.resize(mode.size() - strlen(" + web panel"));
          const char *base = mode == "2x RGBW" ? "boneio-dr-gen2-2rgbw-01"
                           : mode == "4x CCT"  ? "boneio-dr-gen2-4cct-01"
                                               : "boneio-dr-gen2-8ch-01";
          id(point_firmware_update).execute(base, web);
