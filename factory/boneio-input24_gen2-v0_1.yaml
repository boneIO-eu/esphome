# Factory firmware (CI, boneio.eu/esp): boneio-input24_gen2-v0_1.yaml plus boneIO updates.
substitutions:
  # CI sets the release; the update entity compares it with the manifest.
  firmware_version: "dev"

packages:
  device: !include ../boneio-input24_gen2-v0_1.yaml
  update: !include update.yaml
  api_key: !include api_key.yaml

esphome:
  project:
    version: "0.1-${firmware_version}"
