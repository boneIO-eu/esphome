globals:
  - id: confirmed_shutter_count
    type: int
    restore_value: no
    initial_value: "0"

substitutions:
  name: boneio-gen2-32-l-01
  friendly_name: "boneIO ESP Gen2 32x10 Lights"
  serial_prefix: "esp-gen2" # Don't change it.
  firmware_manifest: "https://boneio.eu/fwesp/boneio-gen2-32x10_lights.json"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: boneio.32x10-lights-gen2
    version: "0.1"
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - if:
          condition:
            lambda: "return id(serial_no) != nullptr;"
          then:
            - component.update: serial_no
            - logger.log: "Serial No updated on boot"
          else:
            - logger.log: "Serial No component not found"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

ethernet:
  id: eth
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO39
  miso_pin: GPIO38
  cs_pin: GPIO12
  interrupt_pin: GPIO2
  reset_pin: GPIO1
  clock_speed: 25MHz

i2c:
  sda: GPIO10
  scl: GPIO11
  id: i2c_bus
  scan: true
  frequency: 400kHz

mcp23017:
  - id: mcp_inputs_1to16
    i2c_id: i2c_bus
    address: 0x20
  - id: mcp_inputs_17to32
    i2c_id: i2c_bus
    address: 0x21
  - id: mcp_left
    i2c_id: i2c_bus
    address: 0x23
  - id: mcp_right
    i2c_id: i2c_bus
    address: 0x24

gp8403:
  id: gp8403_dac
  i2c_id: i2c_bus
  address: 0x58
  voltage: 10V

# one_wire:
#   - platform: ds2484
#     id: ds2484_hub
#     i2c_id: i2c_bus
#     address: 0x18
#     active_pullup: true

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: packages-v2.1.0
    files: ["packages/devices/serial_no.yaml"]

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-esp-gen2.yaml@latest
  import_full_config: true

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  local: true
  version: 3

time:
  # DS3231MZ+ hardware RTC — keeps time during HA outages
  - platform: ds1307
    id: rtc_time
    i2c_id: i2c_bus
    address: 0x68
    update_interval: never
  # HA time syncs the RTC on connect
  - platform: homeassistant
    timezone: Europe/Warsaw
    id: homeassistant_time
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time

debug:
  update_interval: 15s

sensor:
  # Shutter count resistor ladder — reads the shutter selector dial via ADC
  - platform: adc
    pin: GPIO4
    id: raw_sig
    attenuation: 12db
    update_interval: 50ms
    filters:
      - multiply: 1.0
    on_value:
      then:
        - lambda: |-
            static int last_raw_n = 0;
            static int stability_counter = 0;
            float v_adc = x;
            float v_in = id(ina_vin).state;
            if (v_in > 5.0) {
              int current_n = int(((v_adc * 249.6) / v_in) + 0.5);
              if (current_n > 31) current_n = 31;
              if (current_n < 0) current_n = 0;
              if (current_n == last_raw_n) {
                if (stability_counter < 10) stability_counter++;
              } else {
                stability_counter = 0;
                last_raw_n = current_n;
              }
              if (stability_counter == 10) {
                id(confirmed_shutter_count) = current_n;
              }
            }
  - platform: template
    name: "Shutter Count"
    id: shutter_count_num
    unit_of_measurement: ""
    icon: "mdi:window-shutter-cog"
    accuracy_decimals: 0
    update_interval: 100ms
    lambda: "return id(confirmed_shutter_count);"
  - platform: lm75b
    id: boneIO_temp
    name: "Temperature"
    update_interval: 30s
    entity_category: diagnostic
    on_value_range:
      - above: 70.0
        then:
          - switch.turn_on: buzzer
      - below: 70.0
        then:
          - switch.turn_off: buzzer
  - platform: ina226
    address: 0x40
    adc_time:
      voltage: 140us
      current: 332us
    current:
      name: "INA226 Current"
    power:
      name: "INA226 Power"
    bus_voltage:
      name: "INA226 Bus Voltage"
      id: ina_vin
    shunt_voltage:
      name: "INA226 Shunt Voltage"
  - platform: adc
    pin: GPIO5
    name: "Analog Input 0-10V 1"
    id: analog_input_1
    update_interval: 1s
    attenuation: 0db
    filters:
      - multiply: 11.0
  - platform: adc
    pin: GPIO6
    name: "Analog Input 0-10V 2"
    id: analog_input_2
    update_interval: 1s
    attenuation: 0db
    filters:
      - multiply: 11.0
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"

