text_sensor:
  # Binary representation of the shutter selector address (5-bit)
  - platform: template
    name: "Shutter Address Binary"
    id: binary_address
    update_interval: 100ms
    lambda: |-
      int n = id(confirmed_shutter_count);
      char buf[6];
      for (int i = 0; i < 5; i++) {
          buf[4-i] = (n & (1 << i)) ? '1' : '0';
      }
      buf[5] = '\0';
      return {buf};
